<header>
  <div id="menu">

    <!-- Logo WStore redesenhado -->
    <div id="logo">
      <a routerLink="/home" id="logo-link" aria-label="WStore — página inicial">
        <svg id="logo-icon" width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gBg" x1="0" y1="0" x2="46" y2="46" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
            </linearGradient>
            <linearGradient id="gW" x1="5" y1="10" x2="41" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#a8c8f0"/>
            </linearGradient>
          </defs>
          <rect width="46" height="46" rx="11" fill="url(#gBg)"/>
          <rect x="0.75" y="0.75" width="44.5" height="44.5" rx="10.5"
                stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none"/>
          <path d="M7 12 L13.5 33 L20 19.5 L23 27 L26 19.5 L32.5 33 L39 12"
                stroke="url(#gW)" stroke-width="3" fill="none"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="23" cy="37" r="2.2" fill="#f5a623"/>
        </svg>

        <div id="logo-texto">
          <span id="logo-nome">WStore</span>
          <span id="logo-sub">e-commerce</span>
        </div>
      </a>
    </div>

    <!-- Barra de pesquisa (apenas na home) -->
    <div *ngIf="paginaPrincipal" id="barra-pesquisa">
      <p id="titulo" style="font-style:italic;text-align:center;margin:15px;color:white;">
        WStore &mdash; Um novo conceito de e-commerce na Web
      </p>
      <div style="display:flex;flex-direction:row;width:100%">
        <input type="text" [(ngModel)]="textoPesquisa" placeholder="Pesquisar produtos..."
               (keyup.enter)="pesquisarProduto()" />
        <button style="width:50px;border-radius:5px;border:none;margin-left:3px"
                (click)="pesquisarProduto()" id="btn-pesq-barra" aria-label="Pesquisar">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 64 64" fill="none">
            <circle cx="28" cy="28" r="16" stroke="#333" stroke-width="4"/>
            <line x1="40" y1="40" x2="56" y2="56" stroke="#333" stroke-width="4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Botões de usuário + carrinho (apenas na home) -->
    <div *ngIf="paginaPrincipal" id="botoes">
      <nav style="display:flex;align-items:center;">

        <!-- Não autenticado -->
        <div *ngIf="usuarioLoja == null" style="margin-top:15px;text-align:center;">
          <a class="btn-menu" routerLink="/cadastro" style="min-width:80px;display:inline-block">Cadastro</a>
          <a class="btn-menu" routerLink="/login"    style="min-width:80px;display:inline-block">Login</a>
        </div>

        <!-- Autenticado -->
        <div *ngIf="usuarioLoja != null" style="margin-top:18px;height:40px;" id="botoes-usuario">
          <a routerLink="/cadastro" style="color:white;text-wrap-mode:nowrap;font-size:14px">Meu perfil</a>
          <p style="color:white;font-size:10px;">{{ usuarioLoja.username }}</p>
          <button mat-flat-button (click)="logout()"
                  style="color:white;font-size:11px;background:transparent;border:1px solid white;padding:2px 8px;">
            Sair
          </button>
        </div>

        <!-- Ícone do carrinho -->
        <a *ngIf="usuarioLoja != null" routerLink="/compra" id="btn-carrinho-header" aria-label="Carrinho de compras">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
               stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span class="carrinho-badge" *ngIf="totalItensCarrinho > 0">{{ totalItensCarrinho }}</span>
        </a>

      </nav>
    </div>
  </div>

  <!-- Menu de categorias (apenas na home) -->
  <div *ngIf="paginaPrincipal" id="menu-categorias">
    <button (click)="onFiltroCategoriaChange(FiltroCategoriaProduto.Eletronicos)"
        [class.categoriaSelecionada]="categoriaSelecionada === FiltroCategoriaProduto.Eletronicos"
        mat-flat-button>Eletrônicos</button>
    <button (click)="onFiltroCategoriaChange(FiltroCategoriaProduto.Acessorios)"
        [class.categoriaSelecionada]="categoriaSelecionada === FiltroCategoriaProduto.Acessorios"
        mat-flat-button>Acessórios</button>
    <button (click)="onFiltroCategoriaChange(FiltroCategoriaProduto.Mobilia)"
        [class.categoriaSelecionada]="categoriaSelecionada === FiltroCategoriaProduto.Mobilia"
        mat-flat-button>Mobília</button>
    <button (click)="onFiltroCategoriaChange(FiltroCategoriaProduto.Moda)"
        [class.categoriaSelecionada]="categoriaSelecionada === FiltroCategoriaProduto.Moda"
        mat-flat-button>Moda</button>
    <button (click)="onFiltroCategoriaChange(FiltroCategoriaProduto.Ferramentas)"
        [class.categoriaSelecionada]="categoriaSelecionada === FiltroCategoriaProduto.Ferramentas"
        mat-flat-button>Ferramentas</button>
    <button (click)="onFiltroCategoriaChange(FiltroCategoriaProduto.Lazer)"
        [class.categoriaSelecionada]="categoriaSelecionada === FiltroCategoriaProduto.Lazer"
        mat-flat-button>Lazer</button>
  </div>
</header>
