<footer *ngIf="podeExibir" class="footer">

  <div class="footer-inner">

    <!-- Coluna 1: marca -->
    <div class="col col-marca">
      <div class="footer-logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="8" fill="white" fill-opacity="0.12"/>
          <path d="M6 8h3.5l4 9 4-9h5l4 9 4-9H34" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 20l3 8h12l3-8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="14" cy="30" r="1.8" fill="#ffffff"/>
          <circle cx="22" cy="30" r="1.8" fill="#ffffff"/>
        </svg>
        <span class="footer-logo-txt">WStore</span>
      </div>
      <p class="footer-slogan">Um novo conceito de e-commerce na Web</p>
    </div>

    <!-- Coluna 2: links -->
    <div class="col">
      <p class="col-titulo">Navegação</p>
      <a routerLink="/home">Home</a>
      <a routerLink="/login">Login</a>
      <a routerLink="/cadastro">Cadastro</a>
      <a routerLink="/compra">Carrinho</a>

          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
        </svg>
        danielmqs1998&#64;gmail.com
      </a>
      <a href="https://github.com/Danielmqs1998" target="_blank" rel="noopener" class="footer-link-icone">

      <span class="tech-badge">MongoDB</span>
      <span class="tech-badge">Java 17</span>
