<h4 id="mensagem">Seja bem-vindo(a) à wSTORE!</h4>
<div id="container">
  <fieldset style="border: none">

    <div style="margin-top: 30px;">
      <label for="usuario">E-mail</label>
      <input id="usuario" [(ngModel)]="login" type="email"
             autocomplete="username"
             style="height: 30px; font-size: 14px;" />
    </div>

    <div style="margin-top: 30px">
      <label for="senha">Senha</label>
      <input id="senha" [(ngModel)]="senha" type="password"
             autocomplete="current-password"
             (keyup.enter)="efetuarLogin()"
             style="height: 30px; font-size: 14px;" />
    </div>

    <div id="btn-entrar">
      <button mat-flat-button (click)="efetuarLogin()" [disabled]="carregando">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </button>
    </div>

  </fieldset>
</div>
