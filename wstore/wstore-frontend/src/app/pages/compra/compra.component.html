<h2 style="text-align: center; margin-top: 50px">Carrinho de compras</h2>

<div style="margin: 50px; width: auto;">

  <p *ngIf="itens.length === 0" style="text-align: center; color: #888;">
    Seu carrinho está vazio. <a routerLink="/home">Continuar comprando</a>
  </p>

  <table *ngIf="itens.length > 0" mat-table [dataSource]="itens">

    <ng-container matColumnDef="codigo">
      <th mat-header-cell *matHeaderCellDef>Produto</th>
      <td mat-cell *matCellDef="let item">{{ item.codigoProduto }}</td>
    </ng-container>

    <ng-container matColumnDef="quantidade">
      <th mat-header-cell *matHeaderCellDef>Quantidade</th>
      <td mat-cell *matCellDef="let item">{{ item.quantidade }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div id="dados-compra" *ngIf="itens.length > 0">
    <div id="endereco">
      <p style="margin: 15px">Será entregue no endereço cadastrado.</p>
    </div>
    <div id="totais">
      <h6 style="text-align: end; margin: 20px">Frete: a calcular</h6>
    </div>
  </div>

</div>

<div class="horizontal-center" *ngIf="itens.length > 0">
  <button mat-flat-button (click)="abrirModalConfirmacao()"
          style="height: 60px; width: 200px; margin: 20px;">
    Finalizar compra
  </button>
</div>
