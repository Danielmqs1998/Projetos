<div id="container">
  <fieldset id="filtros">
    <p style="font-size: 20px; color: white; text-align: center; font-weight: 800; padding: 3px;">Filtros</p>

    <div id="filtro-precos" style="border-radius:5px;display:flex;flex-direction:column;background-color:rgb(25 82 132);align-items:center;">
      <p style="margin-top:10px"><strong>Preço</strong></p>
      <div id="filtro-preco-maximo" style="margin:0px 15px;display:inline-grid;">
        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label style="font-size:18px;color:white;">Preço máximo</mat-label>
          <input [(ngModel)]="precoMaximo" matInput type="number" min="0" style="color:white;font-weight:700;"/>
        </mat-form-field>
      </div>
      <div id="filtro-preco-minimo" style="margin:0px 15px;display:inline-grid;">
        <mat-form-field appearance="outline" floatLabel="always">
          <mat-label style="font-size:18px;color:white;">Preço mínimo</mat-label>
          <input [(ngModel)]="precoMinimo" matInput type="number" min="0" style="color:white;font-weight:700;"/>
        </mat-form-field>
      </div>
    </div>

    <div id="filtro-estado" style="border-radius:5px;background-color:rgb(25 82 132);display:flex;flex-direction:column;align-items:center;">
      <p style="margin-top:10px"><strong>Estado</strong></p>
      <label>
        <mat-radio-group name="estadoProduto" [(ngModel)]="estado">
          <mat-radio-button color="primary" *ngFor="let est of estados" [value]="est">{{ est }}</mat-radio-button>
        </mat-radio-group>
      </label>
    </div>

    <div id="filtro-condicao" style="border-radius:5px;background-color:rgb(25 82 132);display:flex;flex-direction:column;align-items:center;">
      <p style="margin-top:10px"><strong>Condição</strong></p>
      <div style="display:flex;flex-direction:column;justify-content:center;">
        <mat-checkbox color="primary" [value]="FiltroCondicaoProduto.Promocao"    (change)="onFiltroCondicoesChange($event)">Promoção</mat-checkbox>
        <mat-checkbox color="primary" [value]="FiltroCondicaoProduto.FreteGratis" (change)="onFiltroCondicoesChange($event)">Frete grátis</mat-checkbox>
        <mat-checkbox color="primary" [value]="FiltroCondicaoProduto.EntregaRapida" (change)="onFiltroCondicoesChange($event)">Entrega rápida</mat-checkbox>
      </div>
    </div>

    <button mat-flat-button id="btn-pesquisa-filtros" (click)="aplicarFiltros()" [disabled]="carregando">
      {{ carregando ? 'Buscando...' : 'Aplicar' }}
    </button>
  </fieldset>

  <!-- Painel de produtos com overlay de carregamento -->
  <div id="painel-wrapper">
    <div id="overlay-carregando" *ngIf="carregando">
      <div class="spinner-overlay"></div>
      <span>Buscando produtos...</span>
    </div>

    <div id="painel-produtos" [class.carregando]="carregando">
      <app-card-produto
        *ngFor="let produto of produtos | paginate: { itemsPerPage: 16, currentPage: paginaAtual, totalItems: totalItems }"
        [produto]="produto" />
    </div>
  </div>
</div>

<pagination-controls
  class="pagination"
  [previousLabel]="previousLabel"
  [nextLabel]="nextLabel"
  (pageChange)="consultaProdutos($event)" />
